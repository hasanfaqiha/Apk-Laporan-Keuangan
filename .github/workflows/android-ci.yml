name: Android CI - Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Create Google Services JSON (Optional)
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ ! -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          echo "✅ google-services.json created from secrets"
        else
          echo "⚠️ No GOOGLE_SERVICES_JSON secret found. Creating dummy file to allow build."
          # Create a minimal dummy file just to pass compilation if specific features aren't used in debug build
          mkdir -p app
          echo '{"project_info": {"project_number": "dummy"}, "client": [{"client_info": {"mobilesdk_app_id": "dummy"}}]}' > app/google-services.json
        fi

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: ./apk

    - name: Get Version Name
      id: version
      run: |
        VERSION_NAME=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle.kts || echo "1.0.0")
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Generated Version: $VERSION_NAME"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
        name: Release v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
        body: |
          ## 🚀 Update KeuanganKu
          
          **Version:** ${{ steps.version.outputs.version }}
          **Build Number:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          
          ### Changes
          - Clean Architecture Implementation
          - UI/UX Redesign (MYBCA Style)
          - Enhanced Features & Security
          
          > Auto-generated by GitHub Actions
        files: ./apk/app-debug.apk
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}

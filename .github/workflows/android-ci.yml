# =============================================================================
# KeuanganKu — Android CI: test, build, and release installable APKs
# -----------------------------------------------------------------------------
# What this workflow does
#   1. Runs the unit tests.
#   2. Builds an installable DEBUG APK (signed with the debug key).
#   3. Builds a signed RELEASE APK when the signing secrets below are
#      configured (optional).
#   4. Uploads the APKs as workflow artifacts (Actions -> workflow run ->
#      "keuanganku-apk") so you can download and install them directly.
#   5. Creates a GitHub Release with the APK(s) attached whenever you push a
#      tag like `v1.0.0`, or whenever you trigger it manually
#      (Actions -> "Android CI" -> Run workflow).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions)
#   - GOOGLE_SERVICES_JSON    (optional) base64 of app/google-services.json
#   - RELEASE_KEYSTORE_BASE64 (optional) base64 of your release .keystore/.jks
#   - KEYSTORE_PASSWORD       (optional) keystore password
#   - KEY_ALIAS               (optional) signing key alias
#   - KEY_PASSWORD            (optional) key password
#
# Without the release secrets the workflow still succeeds and publishes the
# installable debug APK.
# =============================================================================
name: Android CI - Build, Test & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + APK build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "google-services.json already present in the repository; keeping it."
          elif [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json
            echo "google-services.json restored from the GOOGLE_SERVICES_JSON secret."
          else
            mkdir -p app
            printf '%s\n' '{"project_info":{"project_number":"dummy","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"dummy:android:000000000000","project_number":"000000000000"},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{}}]}' > app/google-services.json
            echo "No google-services.json and no secret: wrote a dummy so the build can proceed."
          fi

      - name: Restore release signing config (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            mkdir -p keystore
            echo "${KEYSTORE_BASE64}" | base64 --decode > keystore/release.keystore
            printf '%s\n' \
              "storeFile=keystore/release.keystore" \
              "storePassword=${KEYSTORE_PASSWORD}" \
              "keyAlias=${KEY_ALIAS}" \
              "keyPassword=${KEY_PASSWORD}" \
              > keystore.properties
            echo "Release signing restored from secrets."
          else
            echo "No keystore secrets found: only the debug APK will be produced."
          fi

      - name: Read versionName
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1 || true)
          VERSION="${VERSION:-1.0}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Keuanganku version ${VERSION}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble APKs
        run: |
          ./gradlew assembleDebug --no-daemon
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Collect APKs
        run: |
          mkdir -p release-artifacts
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/Keuanganku-v${VERSION}-debug.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Keuanganku-v${VERSION}-release.apk"
          fi
          ls -la release-artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keuanganku-apk
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: keuanganku-apk
          path: release-artifacts

      - name: Compute release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ needs.build.outputs.version }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Keuanganku v${{ needs.build.outputs.version }} (Build ${{ github.run_number }})
          body: |
            ## 🚀 Keuanganku APK

            **Versi:** v${{ needs.build.outputs.version }}
            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### 📲 Cara Install
            1. Unduh file APK di bawah ini.
            2. Buka file APK di HP Android (izinkan instalasi dari sumber tidak dikenal bila diminta).
            3. `-debug.apk` digunakan untuk pengujian; `-release.apk` adalah versi rilis bertanda tangan (muncul hanya jika secret keystore dikonfigurasi).

            > Auto-generated by GitHub Actions
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
